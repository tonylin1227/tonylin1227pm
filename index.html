<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tony Lin LINE 聯絡方式</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
      color: #222;
      background: #f7f8fa;
    }
    main {
      width: min(100%, 560px);
      padding: 28px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgb(0 0 0 / 8%);
    }
    .qr-link { display: inline-block; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; }
    p { margin: 20px 0 0; font-size: 1.1rem; }
    .line-link {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 24px;
      border-radius: 999px;
      background: #06c755;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .line-link:hover { background: #05ad4b; }
  </style>
</head>
<body>
  <main>
    <a class="qr-link" href="https://line.me/ti/p/N5C6lJXcQE" target="_blank" rel="noopener noreferrer" aria-label="開啟 LINE 好友頁面">
      <img src="1000042651.jpg" alt="LINE 好友 QR Code">
    </a>
    <p>掃描 QR Code 或點擊下方連結加入 LINE 好友</p>
    <a class="line-link" href="https://line.me/ti/p/N5C6lJXcQE" target="_blank" rel="noopener noreferrer">加入 LINE 好友</a>
  </main>
</body>
</html>
